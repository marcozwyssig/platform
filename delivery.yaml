# The delivery kernel's task catalogue (netctl#1437): the coordinate space between the platform and a
# *ctl product. A product imports a NAMESPACE and refers to `<namespace>:<name>`, never to a module path,
# so a body can move inside the kernel without breaking a product manifest.
#
# The kernel generates no module of its own - it has no CLI, only bodies and this registry. Only a
# product generates, because only a product has a surface.
#
# Exactly the twelve coordinates netctl references today, no more. A catalogue that offers what nobody
# imports is speculation, and the design's own rule is the minimum that solves the problem.
#
# `help:` here is the fallback wording. A product's own `help:` wins where it declares one, and for a
# non-shared body the CLI summary comes from the body's DOCSTRING anyway (see delivery.taskgen).

# The CI/CD loop's SHAPE, owned by the platform (netctl#1444, spec step 7). Every *ctl product runs the
# same build -> test -> release -> deploy -> monitor loop, so declaring it once here beats each product
# restating it. A product contributes MEMBERS to these groups through its own `groups:` keys.
#
# THIS BLOCK IS THE COMPLETE LIST OF GROUPS (netctl#1462). While it is present the loader refuses both a
# bare `groups:` key that names something absent from it and a product's own `taxonomy:` block, so a
# product can add TASKS freely but cannot add a GROUP. That is the point: someone moving between two
# *ctl products finds the same groups holding the same general tasks. A genuinely new group is added
# HERE, once, and every product gets it - which also means adding one is a decision about all of them.
#
# The lock is conditional on this block existing, so a product on a tasks-only catalogue keeps its own
# tree and can adopt the shape in its own time.
taxonomy:
  build:   { help: "Produce the artefacts." }
  test:    { help: "Verify them." }
  release: { help: "Publish them." }
  deploy:  { help: "Put them into an environment.", env_first: true }
  monitor: { help: "Watch what is running there.", env_first: true }
  support:
    help: "Host preflight, environment introspection and host tooling."
    groups:
      git: { help: "Version-control helpers." }
  tasks:   { help: "The task machinery itself: regenerate the CLI module, list the coordinates." }

tasks:

  # --- vcs: the version-control verbs -----------------------------------------------------------------
  vcs:commit:
    impl: delivery.tasks.vcs:commit
    help: "git add -A + git commit -m."
  vcs:push:
    impl: delivery.tasks.vcs:push
    help: "git pull --rebase then push (current branch)."
  vcs:prune-branches:
    impl: delivery.tasks.vcs:prune_branches
    help: "Delete local branches already merged into main (squash-aware via gh)."
  vcs:submodules:
    impl: delivery.tasks.vcs:submodules
    help: "git submodule update --init lib/platform (init the delivery-kernel submodule a fresh worktree needs)."

  # --- test: the suite runner ------------------------------------------------------------------------
  # `gate` backs EVERY declared suite level: one body, several commands, each identifying itself by the
  # name it was invoked as (netctl#1406). A product declares one entry per level and overrides the help,
  # which is the case the shared-impl rule in delivery.taskgen exists for.
  test:gate:
    impl: delivery.tasks.testrun:gate
    help: "Run a declared pytest suite against the running lab."
    passthrough_args: true
  test:report:
    impl: delivery.tasks.testrun:report_cmd
    help: "Merge the unit results into the shared Allure results and render the HTML archive."
  test:accept:
    impl: delivery.tasks.testrun:accept_cmd
    help: "Run the lab-based suites in sequence against the running lab."
    passthrough_args: true

  # --- support: host and tooling upkeep ---------------------------------------------------------------
  support:nexus:
    impl: delivery.tasks.nexus:nexus_cmd
    help: "Drive the LAN Sonatype Nexus artefact proxy: up | down | status | repos | cleanup."
  support:claude-plugins:
    impl: delivery.tasks.claudeplugins:install_cmd
    help: "Install the Claude Code plugins declared in the manifest's `claude` section; idempotent."
  support:environments:
    impl: delivery.tasks.env:environments
    help: "List the named environments and the backend each targets, marking the active one."

  # --- tasks: the task machinery, addressable ---------------------------------------------------------
  # `generate` writes the product's committed CLI module; `catalogue` prints this file. Both are kernel
  # mechanisms: what is product-specific reaches them through delivery.context and a manifest-pinned
  # `with: { target: ... }`, never through an import.
  tasks:generate:
    impl: delivery.tasks.tasks:generate
    help: "Regenerate the product's CLI module from its manifest (--check reports drift and writes nothing)."
  tasks:catalogue:
    impl: delivery.tasks.tasks:catalogue
    help: "List the task coordinates the delivery kernel offers, marking the namespaces this product imports."
