# Minimal CI (netctl#592 decision 7): pytest over the delivery block. The consensus Java module has
# no wrapper checked in and is exercised by the consumers' CI (Gradle composite via lib/platform),
# so the Java gate stays consumer-side for now.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # The full delivery test dep set (mirrors netctl's unit-py requirements): the S1/S2 topology +
        # clabrender tests need jinja2 + cryptography, test_cli needs click/typer (click pinned <8.2 for
        # typer 0.12.5's make_metavar signature). Without these the collection errored on those modules.
        run: pip install pytest pyyaml textual "pydantic==2.13.4" jinja2 cryptography "typer==0.12.5" "click==8.1.7"
      - name: Run the delivery unit tests
        run: python -m pytest src/delivery/test/unit/python -v
