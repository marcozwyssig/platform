# Minimal CI (netctl#592 decision 7): pytest over the delivery block. The consensus Java module has
# no wrapper checked in and is exercised by the consumers' CI (Gradle composite via lib/platform),
# so the Java gate stays consumer-side for now.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # Install the kernel's OWN pins rather than a hand-copied list. The copy that stood here had
        # already drifted (textual, jinja2 and cryptography were unpinned; rich was missing), and adding
        # invoke to requirements.txt for netctl#1434 never reached this gate - the collection errored on
        # the two new test modules while netctl's own gate, which does read the file, was green. A gate
        # that can disagree with the dependency declaration it exists to verify is worth less than it
        # looks. pytest is separate because it is a TEST dep, not a kernel runtime one.
        run: pip install pytest -r src/delivery/requirements.txt
      - name: Run the delivery unit tests
        run: python -m pytest src/delivery/test/unit/python -v
